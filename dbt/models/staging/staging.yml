version: 2

models:
  - name: bronze_pihps_raw
    description: >
      Bronze PIHPS: one row per request, payload exactly as received, joined to the
      fetch manifest. Read from data/bronze/pihps/ (raw files + _manifest.jsonl). Never parsed.
    columns:
      - name: request_key
        description: Manifest key (backfill|tier|city|year or daily|date|tier|city).
        data_tests: [not_null]
      - name: status
        description: ok | empty | failed (shape check at the door).
        data_tests:
          - accepted_values:
              arguments: {values: [ok, empty, failed]}

  - name: bronze_bps_raw
    description: Bronze BPS WebAPI responses (one per table x year fetch), as received.
    columns:
      - name: request_key
        data_tests: [not_null]

  - name: stg_cpi
    description: >
      Monthly CPI from BPS, one row per month x region x group x CPI base year.
      region_level = national | province | city. The CPI base changed in 2024 (2018=100 ->
      2022=100); index_value is only comparable within one base_year, while mom_pct and
      yoy_pct (decimals) are comparable across bases. city_id = PIHPS city when the BPS
      city name matches one (else NULL). province_id is NULL for national rows and for
      the 2022 Papua split provinces, which PIHPS does not have.
      group_code 1551 = food, beverages & tobacco; 1552 = food.
    data_tests:
      - unique_combination:
          arguments: {columns: [month, base_year, region_level, bps_region_code, group_code]}
    columns:
      - name: month
        data_tests: [not_null]
      - name: group_code
        data_tests:
          - accepted_values:
              arguments: {values: [1551, 1552]}
      - name: region_level
        data_tests:
          - accepted_values:
              arguments: {values: [national, province, city]}
      - name: city_id
        data_tests:
          - relationships:
              arguments: {to: ref('pihps_cities'), field: city_id}
      - name: province_id
        data_tests:
          - relationships:
              arguments: {to: ref('provinces'), field: province_id}

  - name: bronze_weather_raw
    description: Bronze Open-Meteo responses (one per province x date range), as received.
  - name: bronze_fx_raw
    description: Bronze Frankfurter (ECB) USD/IDR responses, as received.

  - name: stg_weather
    description: >
      Daily weather per province at its capital (Open-Meteo archive, ERA5-based).
      Latest fetch wins; the last ~5 days are preliminary. Source: Open-Meteo.com (CC BY 4.0).
    data_tests:
      - unique_combination:
          arguments: {columns: [date, province_id]}
    columns:
      - name: date
        data_tests: [not_null]
      - name: province_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('provinces'), field: province_id}

  - name: stg_fx
    description: >
      USD/IDR per calendar day (ECB reference rate via Frankfurter). Days without a
      published rate carry the last one forward with is_filled = true.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: usd_idr
        data_tests: [not_null]

  - name: stg_pihps_price
    description: >
      Silver PIHPS prices, one row per date x commodity x city x market tier. Latest fetch
      wins per key. No forward-fill. is_jump_flag marks a >60% change vs the city's
      previous observation (warn, row kept).
    data_tests:
      - unique_combination:
          arguments: {columns: [date, commodity_raw, city_id, market_tier]}
    columns:
      - name: date
        data_tests: [not_null]
      - name: commodity_id
        description: NULL means a new PIHPS spelling not yet in pihps_commodity_names.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('commodities'), field: commodity_id}
      - name: province_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('provinces'), field: province_id}
      - name: city_id
        data_tests: [not_null]
      - name: market_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [traditional, modern, wholesale, producer]}
      - name: unit
        data_tests:
          - accepted_values:
              arguments: {values: [kg, liter]}
      - name: price_idr_per_unit
        description: Integer rupiah per unit.
        data_tests:
          - not_null
          - price_within_bounds:
              config: {severity: warn}
      - name: is_jump_flag
        data_tests:
          - is_false:
              config: {severity: warn}
