version: 2

models:
  - name: ana_national_price
    description: >
      National traditional-market price per commodity and day (median across provinces),
      only on days when at least 80% of the provinces that usually report the commodity
      did. Holidays where 1-2 provinces report alone are dropped.
    data_tests:
      - unique_combination:
          arguments: {columns: [date, commodity_id]}
    columns:
      - name: price_idr
        data_tests: [not_null]
      - name: n_provinces
        data_tests: [not_null]

  - name: ana_a5_lebaran_daily
    description: >
      A5 Lebaran & Ramadan effects, one row per commodity x Lebaran year x day from 60 days
      before to 30 days after Lebaran. National traditional-market price (median across
      provinces), divided by its centered 365-day rolling median, indexed to 100 over the
      week around day -60. Ramadan starts at day -30 or -29.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, lebaran_year, event_day]}
    columns:
      - name: commodity_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_commodity'), field: commodity_id}
      - name: event_day
        description: Days from Lebaran; negative = before.
        data_tests: [not_null]
      - name: index_value
        description: 100 = the price trend two months before Lebaran.
        data_tests: [not_null]

  - name: ana_a5_lebaran_phases
    description: >
      A5 summary per commodity and phase of the Lebaran cycle: the per-year average index,
      then the median, min and max across years.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, phase_order]}
    columns:
      - name: index_median
        data_tests: [not_null]
      - name: n_years
        data_tests: [not_null]

  - name: ana_a5_lebaran_curve
    description: A5 chart data. Median index and min-max band across years per event day.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, event_day]}

  - name: ana_a6_volatility
    description: >
      A6 volatility and risk ranking per commodity, nationally (province_id NULL) and per
      province, traditional markets, whole history. spike_share = share of days followed by
      a 15%+ rise within 14 days. Province series with one reporting city are flagged
      is_thin and left out of rankings.
    data_tests:
      - unique_combination:
          arguments: {columns: [geo_level, commodity_id, province_id]}
    columns:
      - name: geo_level
        data_tests:
          - accepted_values:
              arguments: {values: [national, province]}
      - name: spike_share
        description: Decimal share of days (0.23 = 23%).
        data_tests: [not_null]
      - name: risk_segment
        data_tests:
          - accepted_values:
              arguments: {values: [low, medium, high]}

  - name: ana_a1_margins_monthly
    description: >
      A1 farm-to-table margins per commodity and month, from matched province-days (producer,
      wholesale and traditional-retail prices all present). Shares are decimals of the retail
      price: medians of same-day, same-province ratios.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, month]}
    columns:
      - name: producer_share
        data_tests: [not_null]
      - name: wholesale_share
        data_tests: [not_null]

  - name: ana_a1_margins_summary
    description: >
      A1 summary per commodity: median monthly producer and wholesale share of the retail
      price, range, and first vs last 12 months. is_thin = producer prices from fewer than 10
      provinces in a typical month.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id]}
    columns:
      - name: producer_share
        data_tests: [not_null]

  - name: ana_a4_compliance_regulation
    description: >
      A4 per commodity, market tier and regulation period: share of province-days above the
      HET ceiling or HAP reference (upper bound), median excess when above, provinces above on
      most days, and the regulation's source. Shares and excess are decimals.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, market_tier, regulation]}
    columns:
      - name: share_above
        data_tests: [not_null]
      - name: regulation
        data_tests: [not_null]

  - name: ana_a4_compliance_province
    description: >
      A4 per commodity, province and market tier: days above the reference, longest and
      current streak of published days above it, median excess when above.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, province_id, market_tier]}
    columns:
      - name: longest_streak_days
        data_tests: [not_null]

  - name: ana_a4_compliance_monthly
    description: A4 heatmap data. Share of published days above the reference per month.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, province_id, market_tier, month]}

  - name: ana_a3_spillover_lags
    description: >
      A3 correlation between a non-centre province's daily traditional-market price change and
      the production centres' change lag_days earlier (0-21). Centres per commodity come from
      the production_centers seed. Pairs with fewer than 200 days are dropped.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, province_id, lag_days]}
    columns:
      - name: correlation
        data_tests: [not_null]

  - name: ana_a3_spillover
    description: >
      A3 summary per commodity and non-centre province: same-day correlation with the
      production centres, the lag with the highest correlation where the link is clear
      (>= 0.2; NULL otherwise), and the distance to the nearest centre in km.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, province_id]}
    columns:
      - name: km_to_nearest_centre
        data_tests: [not_null]

