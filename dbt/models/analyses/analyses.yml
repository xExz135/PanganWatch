version: 2

models:
  - name: ana_national_price
    description: >
      National traditional-market price per commodity and day (median across provinces),
      only on days when at least 80% of the provinces that usually report the commodity
      did. Holidays where 1-2 provinces report alone are dropped.
    data_tests:
      - unique_combination:
          arguments: {columns: [date, commodity_id]}
    columns:
      - name: price_idr
        data_tests: [not_null]
      - name: n_provinces
        data_tests: [not_null]

  - name: ana_a5_lebaran_daily
    description: >
      A5 Lebaran & Ramadan effects, one row per commodity x Lebaran year x day from 60 days
      before to 30 days after Lebaran. National traditional-market price (median across
      provinces), divided by its centered 365-day rolling median, indexed to 100 over the
      week around day -60. Ramadan starts at day -30 or -29.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, lebaran_year, event_day]}
    columns:
      - name: commodity_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_commodity'), field: commodity_id}
      - name: event_day
        description: Days from Lebaran; negative = before.
        data_tests: [not_null]
      - name: index_value
        description: 100 = the price trend two months before Lebaran.
        data_tests: [not_null]

  - name: ana_a5_lebaran_phases
    description: >
      A5 summary per commodity and phase of the Lebaran cycle: the per-year average index,
      then the median, min and max across years.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, phase_order]}
    columns:
      - name: index_median
        data_tests: [not_null]
      - name: n_years
        data_tests: [not_null]

  - name: ana_a5_lebaran_curve
    description: A5 chart data. Median index and min-max band across years per event day.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, event_day]}

  - name: ana_a6_volatility
    description: >
      A6 volatility and risk ranking per commodity, nationally (province_id NULL) and per
      province, traditional markets, whole history. spike_share = share of days followed by
      a 15%+ rise within 14 days. Province series with one reporting city are flagged
      is_thin and left out of rankings.
    data_tests:
      - unique_combination:
          arguments: {columns: [geo_level, commodity_id, province_id]}
    columns:
      - name: geo_level
        data_tests:
          - accepted_values:
              arguments: {values: [national, province]}
      - name: spike_share
        description: Decimal share of days (0.23 = 23%).
        data_tests: [not_null]
      - name: risk_segment
        data_tests:
          - accepted_values:
              arguments: {values: [low, medium, high]}

  - name: ana_a1_margins_monthly
    description: >
      A1 farm-to-table margins per commodity and month, from matched province-days (producer,
      wholesale and traditional-retail prices all present). Shares are decimals of the retail
      price: medians of same-day, same-province ratios.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id, month]}
    columns:
      - name: producer_share
        data_tests: [not_null]
      - name: wholesale_share
        data_tests: [not_null]

  - name: ana_a1_margins_summary
    description: >
      A1 summary per commodity: median monthly producer and wholesale share of the retail
      price, range, and first vs last 12 months. is_thin = producer prices from fewer than 10
      provinces in a typical month.
    data_tests:
      - unique_combination:
          arguments: {columns: [commodity_id]}
    columns:
      - name: producer_share
        data_tests: [not_null]

