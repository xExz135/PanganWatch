[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panganwatch"
version = "0.1.0"
description = "Live food price intelligence for Indonesia: daily PIHPS pipeline, forecasts and procurement advice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "pandas>=2.2",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.66",
    "plotly>=5.24",
]
# Statistics for the analyses (analytics/, run weekly); owner-approved 2026-10-26.
analytics = [
    "statsmodels>=0.14",
]
# Forecasting models (ml/, Weeks 7-10); owner-approved 2026-10-25.
ml = [
    "lightgbm>=4.5",
    "shap>=0.46",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
